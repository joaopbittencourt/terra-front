server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Serve static files directly, fallback to index.html for SPA routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: longer cache for static assets
  location ~* \.(?:js|css|map|json|woff2?|ttf|eot|otf)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Disable .htaccess and hidden files
  location ~ /\.
  {
    return 404;
  }
}
