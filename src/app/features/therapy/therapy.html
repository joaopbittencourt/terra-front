<div class="page-container">
  <div class="header-actions">
    <mat-form-field class="filter-field">
      <mat-label>Filtrar</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Buscar terapia">
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="openForm()">
      <mat-icon>add</mat-icon>
      Nova Terapia
    </button>
  </div>

  <div class="table-container mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" class="full-width-table">

      <!-- Nome Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Terapia</th>
        <td mat-cell *matCellDef="let row">{{row.name}}</td>
      </ng-container>


      <!-- Modalidades Column --
      <ng-container matColumnDef="modalities">
        <th mat-header-cell *matHeaderCellDef>Modalidades e Valores</th>
        <td mat-cell *matCellDef="let row">
          <div class="modalidades-cell">
            <mat-chip-set *ngIf="row.values && row.values.length > 0">
              <mat-chip *ngFor="let valor of row.values" variant="outlined">
                <span class="chip-text">
                  {{typeof valor.modality === 'string' ? valor.modality : valor.modality?.modality}}
                </span>
                <span class="chip-valor">R$ {{valor.price | number:'1.2-2'}}</span>
              </mat-chip>
            </mat-chip-set>
            <span *ngIf="!row.values || row.values.length === 0" class="empty-text">Sem modalidades</span>
          </div>
        </td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="active">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let row">
          <mat-icon [class.active-icon]="row.active" [class.inactive-icon]="!row.active">
            {{row.active ? 'check_circle' : 'cancel'}}
          </mat-icon>
          <span>{{row.active ? 'Ativo' : 'Inativo'}}</span>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button color="primary" (click)="onEdit(row)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="onDelete(row)" matTooltip="Excluir">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <!-- Row shown when there is no matching data. -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="4">Nenhuma terapia encontrada</td>
      </tr>
    </table>
    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Selecione a página de terapias"></mat-paginator>
  </div>
</div>
