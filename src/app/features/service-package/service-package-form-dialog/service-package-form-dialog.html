<h2 mat-dialog-title>{{data ? 'Editar' : 'Novo'}} Pacote de Serviço</h2>

<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field class="full-width">
      <mat-label>Nome</mat-label>
      <input matInput formControlName="name" placeholder="Ex: Pacote Básico">
      <mat-error *ngIf="form.get('name')?.hasError('required')">
        Campo obrigatório
      </mat-error>
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Terapia</mat-label>
      <mat-select formControlName="therapy"  
    [compareWith]="compareTherapies">
        <mat-option *ngFor="let therapy of therapies" [value]="therapy">
          {{therapy.name}}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="form.get('therapy')?.hasError('required')">
        Selecione uma terapia
      </mat-error>
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Quantidade de Sessões</mat-label>
      <input matInput formControlName="qtdSessions" type="number" placeholder="Ex: 10">
      <mat-error *ngIf="form.get('qtdSessions')?.hasError('required')">
        Campo obrigatório
      </mat-error>
      <mat-error *ngIf="form.get('qtdSessions')?.hasError('min')">
        Deve ser maior que 0
      </mat-error>
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Preço</mat-label>
      <input matInput formControlName="price" type="number" step="0.01" placeholder="Ex: 199.90">
      <mat-error *ngIf="form.get('price')?.hasError('required')">
        Campo obrigatório
      </mat-error>
      <mat-error *ngIf="form.get('price')?.hasError('min')">
        Preço não pode ser negativo
      </mat-error>
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Descrição</mat-label>
      <textarea matInput formControlName="description" placeholder="Descrição do pacote de serviço"></textarea>
    </mat-form-field>

    <div class="checkbox-group">
      <mat-checkbox formControlName="active">Ativo</mat-checkbox>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="onSave()" [disabled]="!form.valid">
    Salvar
  </button>
</mat-dialog-actions>
