<div class="page-container">
  <div class="header-actions">
    <mat-form-field class="filter-field">
      <mat-label>Filtrar</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Buscar pacote de serviço">
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="openForm()">
      <mat-icon>add</mat-icon>
      Novo Pacote
    </button>
  </div>

  <div class="table-container mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" class="full-width-table">

      <!-- Nome Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let row">{{row.name}}</td>
      </ng-container>

      <!-- Therapy Column -->
      <ng-container matColumnDef="therapy">
        <th mat-header-cell *matHeaderCellDef>Terapia</th>
        <td mat-cell *matCellDef="let row">{{row.therapy?.name || 'N/A'}}</td>
      </ng-container>

      <!-- QtdSessions Column -->
      <ng-container matColumnDef="qtdSessions">
        <th mat-header-cell *matHeaderCellDef>Sessões</th>
        <td mat-cell *matCellDef="let row">{{row.qtdSessions}}</td>
      </ng-container>

      <!-- Price Column -->
      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef>Preço</th>
        <td mat-cell *matCellDef="let row">R$ {{row.price | number:'1.2-2'}}</td>
      </ng-container>

      <!-- Active Column -->
      <ng-container matColumnDef="active">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let row">
          <mat-icon [class.active-icon]="row.active" [class.inactive-icon]="!row.active">
            {{row.active ? 'check_circle' : 'cancel'}}
          </mat-icon>
          <span>{{row.active ? 'Ativo' : 'Inativo'}}</span>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button color="primary" (click)="onEdit(row)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="onDelete(row)" matTooltip="Excluir">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <!-- Row shown when there is no matching data. -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="6">Nenhum pacote de serviço encontrado</td>
      </tr>
    </table>
  </div>
</div>
